name: Publish Docker image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-pr:
    name: Build image without publishing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  smoke:
    name: Run Docker app smoke tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build native amd64 image
        run: docker build --platform linux/amd64 --tag survivormodel-smoke .
      - name: Verify installed app, clean runtime, and BLAS thread overrides
        run: |
          docker run --rm --entrypoint sh survivormodel-smoke \
            -c 'test "$(command -v survivor)" = /root/.julia/bin/survivor && ! command -v xvfb-run >/dev/null 2>&1'
          docker run --rm survivormodel-smoke --help >/dev/null
          docker run --rm \
            --entrypoint julia \
            survivormodel-smoke \
            --project=/app /opt/survivormodel/docker/smoke.jl 1
          docker run --rm \
            -e JULIA_NUM_THREADS=2 \
            -e SURVIVORMODEL_BLAS_THREADS=2 \
            --entrypoint julia \
            survivormodel-smoke \
            --project=/app /opt/survivormodel/docker/smoke.jl 2 2

  publish:
    name: Publish image to Docker Hub
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: moblin88/survivormodel.jl
          labels: |
            org.opencontainers.image.source=https://github.com/Moblin88/SurvivorModel.jl
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
